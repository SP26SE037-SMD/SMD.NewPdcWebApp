name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      # 1. Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Generate image tag
      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=${{ github.run_number }}" >> $GITHUB_ENV

      # 3. Login DockerHub
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_GOOGLE_REDIRECT_URI="${{ secrets.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}" \
            --build-arg NEXT_PUBLIC_BACKEND_URL="${{ secrets.NEXT_PUBLIC_BACKEND_URL }}" \
            --build-arg NEXT_PUBLIC_WS_URL="${{ secrets.NEXT_PUBLIC_WS_URL }}" \
            --build-arg NEXTAUTH_URL="${{ secrets.NEXTAUTH_URL }}" \
            -t taikt2004/smd-frontend:${IMAGE_TAG} .

          docker tag taikt2004/smd-frontend:${IMAGE_TAG} taikt2004/smd-frontend:latest

      # 5. Push image
      - name: Push Docker image
        run: |
          docker push taikt2004/smd-frontend:${IMAGE_TAG}
          docker push taikt2004/smd-frontend:latest

    # 6. Deploy to EC2
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          # 1. KÉO BIẾN TỪ GITHUB SECRETS XUỐNG
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXTAUTH_URL }}
          AUTH_TRUST_HOST: "true"

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # 2. ĐẨY BIẾN QUA KẾT NỐI SSH
          envs: GOOGLE_CLIENT_SECRET, BACKEND_URL, NEXTAUTH_URL, NEXT_PUBLIC_BASE_URL, AUTH_TRUST_HOST
          script: |
            IMAGE_TAG=${{ env.IMAGE_TAG }}

            echo "Deploying frontend version: $IMAGE_TAG"

            # Pull latest image
            sudo docker pull taikt2004/smd-frontend:$IMAGE_TAG

            # Stop old container
            sudo docker stop smd-frontend || true
            sudo docker rm smd-frontend || true

            # 3. BƠM BIẾN VÀO DOCKER CONTAINER LÚC CHẠY
            sudo docker run -d \
              --name smd-frontend \
              -p 3000:3000 \
              -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
              -e BACKEND_URL="$BACKEND_URL" \
              -e NEXTAUTH_URL="$NEXTAUTH_URL" \
              -e NEXT_PUBLIC_BASE_URL="$NEXT_PUBLIC_BASE_URL" \
              -e AUTH_TRUST_HOST="$AUTH_TRUST_HOST" \
              --restart unless-stopped \
              taikt2004/smd-frontend:$IMAGE_TAG

            # Cleanup old images
            sudo docker image prune -af
